# Infra cho dev: chỉ Postgres + Redis. Backend/frontend chạy local (mvnw / npm) cho vòng lặp nhanh.
# ponytail: chưa container hóa backend/frontend. Add Dockerfile + service khi tới Tuần 5 (deploy).
services:
  postgres:
    image: postgres:16-alpine
    container_name: agrisense-postgres
    environment:
      POSTGRES_DB: agrisense
      POSTGRES_USER: agrisense
      POSTGRES_PASSWORD: agrisense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisense"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrisense-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
