spring:
  application:
    name: agrisense
  datasource:
    url: jdbc:postgresql://localhost:5432/agrisense
    username: agrisense
    password: agrisense
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

agrisense:
  jwt:
    # ponytail: secret hardcode cho dev. Tuần 5 chuyển sang biến môi trường JWT_SECRET.
    secret: ${JWT_SECRET:dev-secret-change-me-in-prod-min-32-bytes-long-000}
    expiration-ms: 86400000  # 24h
  ai:
    # để trống → AI trả stub (demo chạy không cần key). Set GEMINI_KEY để gọi thật.
    gemini-key: ${GEMINI_KEY:}
  stream:
    consumer-name: worker-1

server:
  port: 8080
